let timerState = { exerciseKey:'', max:90, remaining:90, totalSets:4, nextSet:1, running:false, paused:false, interval:null };
let timerDecimalInterval = null;
let workoutCalcField = null;
let workoutCalcValues = { reps:'', kg:'' };
let workoutCalcRevealed = { reps:false, kg:false };
let workoutFailureQuality = null; // key από FAILURE_QUALITY_OPTIONS

function parseRestSeconds(restStr){
  const m = String(restStr||'').match(/\d+/);
  return m ? parseInt(m[0],10) : 90;
}
function parseRepRangeStr(repStr){
  const numbers = String(repStr||'').match(/\d+(?:[.,]\d+)?/g) || [];
  const min = Math.max(1, Number(String(numbers[0]||8).replace(',','.')));
  const max = Math.max(min, Number(String(numbers[1]||numbers[0]||10).replace(',','.')));
  return { min, max };
}
let workoutReturnRender = null;
function openWorkoutMode(ex, returnFn){
  const key = ex.exercise+'|'+ex.set+'|'+ex.rep+'|'+ex.rest;
  const maxRest = parseRestSeconds(ex.rest);
  const totalSets = Math.max(1, parseInt(ex.set,10)||1);
  if(timerState.exerciseKey !== key){
    if(timerState.interval) clearInterval(timerState.interval);
    timerState = { exerciseKey:key, max:maxRest, remaining:maxRest, totalSets, nextSet:1, running:false, paused:false, interval:null };
    workoutCalcField = null;
    workoutCalcValues = { reps:'', kg:'' };
    workoutCalcRevealed = { reps:false, kg:false };
    workoutFailureQuality = null;
  }
  state.workoutExercise = ex;
  if(returnFn) workoutReturnRender = returnFn;
  renderWorkoutPage();
}
function closeWorkoutPage(){
  if(workoutReturnRender) workoutReturnRender();
}
function updateWorkoutTimerUI(){
  const numberEl=document.getElementById('timerNumber');
  const ringEl=document.getElementById('timerRing');
  if(numberEl){ numberEl.textContent=timerState.remaining; numberEl.classList.remove('warning','finished'); }
  if(ringEl){
    const progress = timerState.max>0 ? Math.max(0,(timerState.remaining/timerState.max)*100) : 0;
    ringEl.style.setProperty('--progress', progress);
    ringEl.classList.remove('warning','finished');
  }
  if(timerState.remaining===0){ numberEl?.classList.add('finished'); ringEl?.classList.add('finished'); }
  else if(timerState.remaining<=10){ numberEl?.classList.add('warning'); ringEl?.classList.add('warning'); }
  const setBox=document.getElementById('setBox');
  if(setBox){
    setBox.innerHTML = timerState.nextSet>timerState.totalSets ? 'ΟΛΟΚΛΗΡΩΘΗΚΑΝ ΟΛΑ ΤΑ <span class="set-emph">SET</span>' : `ΕΠΟΜΕΝΟ <span class="set-emph">SET ${timerState.nextSet}</span> ΑΠΟ <span class="set-emph">${timerState.totalSets}</span>`;
  }
  const statusEl=document.getElementById('timerStatus');
  if(statusEl){
    if(timerState.running) statusEl.textContent='Η αντίστροφη μέτρηση εκτελείται.';
    else if(timerState.paused) statusEl.textContent='Παύση. Το START συνεχίζει από εκεί που έμεινε.';
    else if(timerState.remaining===0) statusEl.textContent='Το διάλειμμα ολοκληρώθηκε.';
    else statusEl.textContent = `Χρόνος διαλείμματος: ${timerState.max} sec`;
  }
}
function startWorkoutTimer(){
  if(timerState.running) return;
  if(timerState.remaining===0){
    if(timerState.nextSet>timerState.totalSets){
      const s=document.getElementById('timerStatus'); if(s) s.textContent='Η άσκηση ολοκληρώθηκε. Πάτησε ΕΠΑΝΑΦΟΡΑ για νέο κύκλο.';
      return;
    }
    timerState.remaining=timerState.max; timerState.paused=false;
  }
  if(timerState.remaining===timerState.max && !timerState.paused){
    if(timerState.nextSet<timerState.totalSets) timerState.nextSet+=1;
    else if(timerState.nextSet===timerState.totalSets) timerState.nextSet=timerState.totalSets+1;
  }
  timerState.running=true; timerState.paused=false;
  updateWorkoutTimerUI();
  startTimerDecimalTicker();
  timerState.interval=setInterval(()=>{
    timerState.remaining-=1;
    pulseTimerRingGlow();
    if(timerState.remaining<=0){
      timerState.remaining=0;
      clearInterval(timerState.interval); timerState.interval=null;
      timerState.running=false; timerState.paused=false;
      stopTimerDecimalTicker();
      if(navigator.vibrate) navigator.vibrate([180,100,180]);
      try{
        const ctx=new (window.AudioContext||window.webkitAudioContext)();
        const osc=ctx.createOscillator(); const gain=ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value=880;
        gain.gain.setValueAtTime(.14,ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime+0.75);
        osc.start(); osc.stop(ctx.currentTime+0.8);
      }catch(e){}
    }
    updateWorkoutTimerUI();
  },1000);
}
function pulseTimerRingGlow(){
  const ring = document.getElementById('timerRing');
  if(!ring) return;
  ring.classList.add('tick');
  setTimeout(()=>{ ring.classList.remove('tick'); }, 220);
}
function startTimerDecimalTicker(){
  stopTimerDecimalTicker();
  let d = 0;
  const el = document.getElementById('timerDecimal');
  if(el){ el.textContent = '00'; el.classList.add('running'); }
  timerDecimalInterval = setInterval(()=>{
    d = (d+7) % 100;
    const dEl = document.getElementById('timerDecimal');
    if(dEl) dEl.textContent = String(d).padStart(2,'0');
  }, 70);
}
function stopTimerDecimalTicker(){
  if(timerDecimalInterval){ clearInterval(timerDecimalInterval); timerDecimalInterval=null; }
  const el = document.getElementById('timerDecimal');
  if(el){ el.classList.remove('running'); el.textContent='00'; }
}
function stopWorkoutTimer(){
  if(!timerState.running) return;
  clearInterval(timerState.interval); timerState.interval=null;
  timerState.running=false; timerState.paused=true;
  stopTimerDecimalTicker();
  updateWorkoutTimerUI();
}
function resetWorkoutTimer(){
  if(timerState.interval) clearInterval(timerState.interval);
  timerState.interval=null; timerState.remaining=timerState.max; timerState.nextSet=1;
  timerState.running=false; timerState.paused=false;
  stopTimerDecimalTicker();
  updateWorkoutTimerUI();
}

function selectWorkoutCalcField(field){
  workoutCalcField = field;
  workoutCalcValues[field] = ''; // κάθε φορά που πατάς REPS ή KG, μηδενίζει εκείνο το πεδίο και είναι έτοιμο για πληκτρολόγηση
  workoutCalcRevealed[field] = true;
  document.getElementById('repsButton')?.classList.toggle('active', field==='reps');
  document.getElementById('kgButton')?.classList.toggle('active', field==='kg');
  document.getElementById('repsFieldBox')?.classList.toggle('hidden', !workoutCalcRevealed.reps);
  document.getElementById('kgFieldBox')?.classList.toggle('hidden', !workoutCalcRevealed.kg);
  updateWorkoutCalcDisplay();
}
function updateWorkoutCalcDisplay(){
  const r=document.getElementById('repsVal'); if(r) r.textContent = workoutCalcValues.reps || '0';
  const k=document.getElementById('kgVal'); if(k) k.textContent = workoutCalcValues.kg || '0';
  clearWorkoutCalcResults();
}
function addWorkoutCalcNumber(n){
  if(!workoutCalcField){ showWorkoutCalcError('Πάτησε πρώτα REPS ή KG.'); return; }
  const maxLen = workoutCalcField==='reps'?3:5;
  if(workoutCalcValues[workoutCalcField].length>=maxLen) return;
  workoutCalcValues[workoutCalcField]+=n;
  updateWorkoutCalcDisplay();

function roundToStepW(n,step){ return Math.round(n/step)*step; }
function formatCalcNum(n){
  const v = Math.round((Number(n)+Number.EPSILON)*10)/10;
  return Number.isInteger(v)?String(v):String(v).replace('.',',');
}
function calculateWorkoutNextWeight(){
  if(!workoutCalcValues.reps || !workoutCalcValues.kg){ state.repsKgRequiredModalOpen = true; renderModal(); return; }
  const reps0 = Number(workoutCalcValues.reps);
  const kg0 = Number(workoutCalcValues.kg);
  if(!Number.isFinite(reps0)||!Number.isFinite(kg0)||reps0<=0||kg0<=0){ showWorkoutCalcError('Οι τιμές πρέπει να είναι μεγαλύτερες από το μηδέν.'); return; }
  if(!workoutFailureQuality){ state.fqRequiredModalOpen = true; renderModal(); return; }

  const btn = document.getElementById('calcComputeBtn');
  const nw=document.getElementById('nextWeight');
  const cr=document.getElementById('changeResult');
  const cb=document.getElementById('changeBox');
  const cm=document.getElementById('calcMessage');
  if(cb) cb.classList.remove('positive','negative');
  if(cr) cr.classList.remove('positive','negative');
  if(cm) cm.classList.remove('error');
  if(nw) nw.innerHTML = `<span class="calc-thinking">Υπολογισμός<span class="calc-dots"><span>.</span><span>.</span><span>.</span></span></span>`;
  if(cr) cr.textContent = '—';
  if(cm) cm.textContent = '';
  if(btn) btn.disabled = true;

  setTimeout(()=>{
    if(btn) btn.disabled = false;
    performWorkoutCalculation();
  }, 850);
}
function performWorkoutCalculation(){
  const ex = state.workoutExercise;
  const range = parseRepRangeStr(ex.rep);
  const reps = Number(workoutCalcValues.reps);
  const kg = Number(workoutCalcValues.kg);
  if(!workoutCalcValues.reps || !workoutCalcValues.kg){ showWorkoutCalcError('Συμπλήρωσε πρώτα τις επαναλήψεις και τα κιλά.'); return; }
  if(!Number.isFinite(reps)||!Number.isFinite(kg)||reps<=0||kg<=0){ showWorkoutCalcError('Οι τιμές πρέπει να είναι μεγαλύτερες από το μηδέν.'); return; }

  let weightPercent=0, repsPercent=0, explanation='';
  if(reps>=range.min && reps<=range.max){
    weightPercent=0;
    explanation=`Οι ${reps} επαναλήψεις είναι μέσα στον στόχο ${range.min}–${range.max}. Τα κιλά μένουν ίδια.`;
  } else if(reps>range.max){
    repsPercent = ((reps-range.max)/range.max)*100;
    weightPercent = repsPercent<=60 ? repsPercent : 60+(repsPercent-60)*0.5;
    weightPercent = Math.min(weightPercent,230);
    explanation = `Οι επαναλήψεις είναι ${formatCalcNum(repsPercent)}% περισσότερες από το ανώτατο όριο ${range.max}.`;
  } else {
    repsPercent = ((range.min-reps)/range.min)*100;
    weightPercent = -Math.min(repsPercent,90);
    explanation = `Οι επαναλήψεις είναι ${formatCalcNum(repsPercent)}% λιγότερες από το κατώτατο όριο ${range.min}.`;
  }
  const primaryEq = (ex.equipment && ex.equipment[0]) || null;
  const calcType = CALC_TYPES[(primaryEq && primaryEq.calcType) || DEFAULT_CALC_TYPE];
  const roundingStep = calcType.roundingStep;
  const rawNext = kg*(1+weightPercent/100);
  const nextWeight = Math.max(0, roundToStepW(rawNext, roundingStep));
  const change = nextWeight-kg;

  const nw=document.getElementById('nextWeight'); if(nw) nw.innerHTML = `${formatCalcNum(nextWeight)} KG`;
  const cb=document.getElementById('changeBox');
  const cr=document.getElementById('changeResult');
  if(cb) cb.classList.remove('positive','negative');
  if(cr){
    cr.classList.remove('positive','negative');
    if(change>0){ cr.textContent=`+${formatCalcNum(change)} KG`; cr.classList.add('positive'); cb?.classList.add('positive'); }
    else if(change<0){ cr.textContent=`${formatCalcNum(change)} KG`; cr.classList.add('negative'); cb?.classList.add('negative'); }
    else cr.textContent='0 KG';
  }
  const cm=document.getElementById('calcMessage');
  if(cm){ cm.classList.remove('error'); cm.textContent = explanation+` Υπολογισμένη μεταβολή: ${weightPercent>=0?'+':''}${formatCalcNum(weightPercent)}%. Στρογγυλοποίηση ανά ${formatCalcNum(roundingStep)} kg.`; }

  const logCtx = state.workoutLogContext;
  if(logCtx && logCtx.customerCode){
    const setNumber = Math.min(timerState.nextSet||1, timerState.totalSets||1);
    const fq = FAILURE_QUALITY_OPTIONS.find(f=>f.key===workoutFailureQuality) || FAILURE_QUALITY_OPTIONS[0];
    const wv = kg * reps;
    const awv = wv * (fq.pct/100);
    logWorkoutSet({
      customer_code: logCtx.customerCode,
      program_name: logCtx.programName || null,
      exercise: ex.exercise,
      group_label: ex.groupLabel || null,
      set_number: setNumber,
      reps: reps,
      kg: kg,
      calc_type: calcType.key,
      equipment_name: primaryEq ? primaryEq.name : null,
      wv: wv,
      awv: awv,
      failure_quality: fq.key,
      failure_quality_pct: fq.pct,
      created_by: auth.user ? auth.user.id : null
    }).then(ok=>{
      toast(ok ? `Το σετ καταγράφηκε ✓ (AWV ${formatCalcNum(awv)} kg)` : 'Σφάλμα καταγραφής σετ.');
    });
  } else {
    toast('Προεπισκόπηση — δεν καταγράφεται σε ημερολόγιο πελάτη.');
  }
}

function onCodeInputCheck(){
  const code = document.getElementById('f-code').value.trim();
  const note = document.getElementById('match-note');
  const existing = state.customers.find(c=>c.code.toLowerCase()===code.toLowerCase());
  if(existing){

    document.getElementById('f-name').value = existing.name;
    document.getElementById('f-surname').value = existing.surname;
    document.getElementById('f-dob').value = existing.dob || '';
  } else {
    note.innerHTML = '';
  }
}
async function confirmSave(){
  if(state.saveBusy) return;
  const code = document.getElementById('f-code').value.trim();
  const name = document.getElementById('f-name').value.trim();
  const surname = document.getElementById('f-surname').value.trim();
  const dob = document.getElementById('f-dob').value;
  if(!code || !name || !surname){
    toast('Συμπλήρωσε κωδικό, όνομα και επώνυμο.');
    return;
  }
  const record = buildCurrentProgramRecord();
  if(isProgramRecordEmpty(record)){
    toast('Δεν υπάρχουν ασκήσεις στο πρόγραμμα.');
    return;
  }
  record.createdByEmail = auth.email || '';
  if(state.copiedFromProgramId) record.copiedFromId = state.copiedFromProgramId;
  state.saveBusy = true;
  const btn = document.getElementById('modal-confirm');
  if(btn){ btn.disabled = true; btn.textContent='Αποθήκευση...'; }
  try{
    const okC = await upsertCustomer({ code, name, surname, dob });
    const okP = okC ? await insertProgram(code, record) : false;
    if(okC && okP){
      toast('Το πρόγραμμα αποθηκεύτηκε στο ιστορικό του πελάτη.');
      state.saveModalOpen = false;
      state.copiedFromProgramId = null;
      state.customersLoaded = false; // θα ξαναφορτωθεί φρέσκο στο επόμενο άνοιγμα του ιστορικού
      renderModal();
    } else {
      toast('Κάτι πήγε στραβά κατά την αποθήκευση. Δοκίμασε ξανά.');
    }
  }catch(e){
    console.error(e);
    toast('Σφάλμα αποθήκευσης.');
  }finally{
    state.saveBusy = false;
    if(btn){ btn.disabled=false; btn.innerHTML = ICON.save+'Αποθήκευση'; }
  }
}

function renderRecordBodyForCard(record){
  let body = '';
  if(record.nutrition){
    body += `<div style="margin-bottom:10px;font-size:11.5px;"><b>Διατροφή:</b> ${escHtml(record.nutrition.kcal)}</div>`;
  }
  if(record.instructions){

  }
  if(record.notes){
    body += `<div style="margin-bottom:10px;font-size:11.5px;"><b>Παρατηρήσεις:</b> ${escHtml(record.notes)}</div>`;
  }
  if(record.subtype === 'cardio'){
    body += renderCardioPreviewTable(record.cardioSlots||[], '');
  } else if(record.subtype === 'combo'){
    body += (record.days||[]).map(d=>{
      const w = d.groups && d.groups.length ? renderDaysPreviewTable([{label:d.label, groups:d.groups}], {workout:true, programName:getProgramNameForRecord(record)}) : '';
      const c = renderCardioPreviewTable(d.cardioSlots||[], 'Αερόβιο — '+d.label);
      return d.topSection==='cardio' ? (c+w) : (w+c);
    }).join('');
  } else {
    body += renderDaysPreviewTable(record.days||[], {workout:true, programName:getProgramNameForRecord(record)});
  }
  return body;
}
function loadRecordIntoCustomBuilder(record, programId, mode){
  state.category = record.category;
  state.fatburnSubtype = record.subtype || null;
  state.notes = record.notes || '';
  state.instructions = record.instructions || '';
  state.nutritionSet = (record.category==='muscle' && record.nutrition && record.nutrition.setChoice) ? record.nutrition.setChoice : 3;
  if(record.category==='fatburn'){
    const m = record.nutrition && record.nutrition.kcal ? String(record.nutrition.kcal).match(/-?\d+/) : null;
    state.fatburnKcal = m ? parseInt(m[0],10) : 0;
  }
  const fixedSetRep = record.category==='fatburn'
    ? (record.subtype==='weights' ? FATBURN_WEIGHTS_FIXED : (record.subtype==='combo' ? COMBO_WEIGHTS_FIXED : null))
    : null;

  if(record.subtype === 'cardio'){
    state.cardioSlots = buildCardioSlots(6);
    (record.cardioSlots||[]).forEach((s,i)=>{
      if(state.cardioSlots[i]) Object.assign(state.cardioSlots[i], s);
    });
  } else {
    const srcDays = record.days || [];
    state.numDays = Math.max(1, srcDays.length || 4);
    const newDays = buildDays(state.numDays, fixedSetRep);
    newDays.forEach((day, di)=>{
      const srcDay = srcDays[di];
      if(!srcDay) return;
      const used = new Set();
      (srcDay.groups||[]).forEach(g=>{
        const row = day.groups.find(r=>!used.has(r.id) && r.groupLabel===g.groupLabel);
        if(row){
          used.add(row.id);
          row.selected = g.exercise;
          row.customText = '';
          if(!fixedSetRep) row.set = g.set;
          row.failure = g.failure || 0;
          row.equipment = g.equipment || [];
        }
      });
      if(record.subtype === 'combo'){
        day.cardioSlots = buildCardioSlots(4);
        (srcDay.cardioSlots||[]).forEach((s,i)=>{ if(day.cardioSlots[i]) Object.assign(day.cardioSlots[i], s); });
        day.topSection = srcDay.topSection || day.topSection;
      }
    });
    state.days = newDays;
  }
  if(mode === 'edit'){
    state.editingProgramId = programId;
    state.editingOriginalCreator = record.createdByEmail || '';
    state.copiedFromProgramId = null;
  } else {
    state.copiedFromProgramId = programId;
    state.editingProgramId = null;
    state.editingOriginalCreator = '';
  }
  state.tab = 'builder';
  render();
  toast(mode==='edit'
    ? 'Το πρόγραμμα φορτώθηκε για διόρθωση — οι αλλαγές σου θα ενημερώσουν αυτή την ίδια καταχώρηση.'
    : 'Το πρόγραμμα φορτώθηκε στον Builder — κάνε τις αλλαγές σου και πάτησε Αποθήκευση για νέα καταχώρηση.');
}
function getProgramNameForRecord(record){
  if(record && record.fromTemplate && record.templateName) return record.templateName;
  return record ? categoryBadgeLabel(record) : '';
}
function categoryBadgeLabel(record){
  if(record.category==='muscle') return CATEGORY_INFO.muscle.title;
  if(record.subtype) return FATBURN_SUBTYPES[record.subtype].title;
  return CATEGORY_INFO.fatburn.title;
}

function getClientDayItems(record, dayIndex){
  if(record.subtype === 'cardio'){
    return (record.cardioSlots||[]).map(s=>({type:'cardio', ...s}));
  }
  const day = (record.days||[])[dayIndex];
  if(!day) return [];
  const weightsItems = (day.groups||[]).map(g=>({type:'muscle', groupLabel:g.groupLabel, exercise:g.exercise, set:g.set, rep:g.rep, rest:g.rest, failure:g.failure, equipment:g.equipment||[]}));
  if(record.subtype === 'combo'){
    const cardioItems = (day.cardioSlots||[]).map(s=>({type:'cardio', ...s}));
    return day.topSection==='cardio' ? [...cardioItems, ...weightsItems] : [...weightsItems, ...cardioItems];
  }
  return weightsItems;
}

function renderClientMain(){
  const content = document.getElementById('client-content');
  if(!content) return;
  const announcePanel = document.getElementById('client-announce-panel');
  const nav = state.clientNav;
  if(announcePanel) announcePanel.style.display = (nav.view==='programs') ? (announcePanel.innerHTML.trim()?'block':'none') : 'none';

  if(nav.view==='programs' || !nav.programId){
    html = renderClientProgramsListView();
  } else {
    const p = state.selectedCustomerPrograms.find(x=>x.id===nav.programId);
    if(!p){ html = renderClientProgramsListView(); }
    else{
      const record = p.record;
      if(nav.view==='days'){ html = renderClientDaysListView(p, record); }
      else if(nav.view==='items'){ html = renderClientItemsListView(p, record, nav.dayIndex); }
      else if(nav.view==='exercise'){
        const items = getClientDayItems(record, nav.dayIndex);
        html = renderClientExerciseView(items[nav.itemIndex]);
      }

  content.innerHTML = html;

}

function bindClientNavEvents(){
  document.querySelectorAll('[data-open-program]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-open-program');
      const p = state.selectedCustomerPrograms.find(x=>x.id===id);
      if(!p) return;
      const record = p.record;
      state.clientNav = {
        view: record.subtype==='cardio' ? 'items' : 'days',
        programId: id,
        dayIndex: record.subtype==='cardio' ? null : 0,
        itemIndex: null
      };
      renderClientMain();
    });
  });
  document.querySelectorAll('[data-open-day]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.clientNav.view = 'items';
      state.clientNav.dayIndex = parseInt(el.getAttribute('data-open-day'));
      state.clientNav.itemIndex = null;
      renderClientMain();
    });
  });
  document.querySelectorAll('[data-open-item]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.clientNav.view = 'exercise';
      state.clientNav.itemIndex = parseInt(el.getAttribute('data-open-item'));
      renderClientMain();
    });
  });
  document.querySelectorAll('[data-client-back]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const target = el.getAttribute('data-client-back');
      state.clientNav.view = target;
      if(target==='programs'){ state.clientNav.programId=null; state.clientNav.dayIndex=null; state.clientNav.itemIndex=null; }
      else if(target==='days'){ state.clientNav.itemIndex=null; }
      else if(target==='items'){ state.clientNav.itemIndex=null; }
      renderClientMain();
    });
  });
  document.querySelectorAll('[data-client-print]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-client-print');
      const p = state.selectedCustomerPrograms.find(x=>x.id===id);
      document.getElementById('print-area').innerHTML = buildPrintHtml(p.record, auth.customer);
      window.print();
    });
  });
  document.querySelectorAll('[data-client-pdf]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-client-pdf');
      const p = state.selectedCustomerPrograms.find(x=>x.id===id);
      generatePdfFromRecord(p.record, auth.customer);
    });
  });
  document.getElementById('client-start-exercise')?.addEventListener('click', ()=>{
    const nav = state.clientNav;
    const p = state.selectedCustomerPrograms.find(x=>x.id===nav.programId);
    if(!p) return;
    const items = getClientDayItems(p.record, nav.dayIndex);
    const item = items[nav.itemIndex];
    if(item && item.type==='muscle'){
      state.workoutLogContext = { customerCode: auth.customer ? auth.customer.code : null, programName: getProgramNameForRecord(p.record) };
      openWorkoutMode(item, rebuildClientDashboardShell);
    }
  });
  document.querySelectorAll('[data-clientlib-eqphoto]').forEach(el=>{
    el.addEventListener('click', ()=>{ openLightbox('photo', el.getAttribute('data-clientlib-eqphoto')); });
  });
  document.querySelectorAll('[data-clientlib-eqvideo]').forEach(el=>{
    el.addEventListener('click', ()=>{ openLightbox('video', el.getAttribute('data-clientlib-eqvideo')); });
  });
  document.querySelectorAll('[data-clientlib-eqworkout]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const nav = state.clientNav;
      const p = state.selectedCustomerPrograms.find(x=>x.id===nav.programId);
      try{
        state.workoutLogContext = { customerCode: auth.customer ? auth.customer.code : null, programName: p ? getProgramNameForRecord(p.record) : '' };
        openWorkoutMode(JSON.parse(el.getAttribute('data-clientlib-eqworkout')), rebuildClientDashboardShell);
      }catch(e){}
    });
  });
}

function mapTemplateToCustomRecord(t){
  const days = (t.data && t.data.days) || [];
  const isFatburn = t.top_category === 'ΚΑΥΣΗΣ ΛΙΠΟΥΣ';
  let category = 'muscle', subtype = null;
  if(isFatburn){
    category = 'fatburn';
    if(t.sub_category === 'ΚΑΥΣΗ ΛΙΠΟΥΣ ΜΕ ΒΑΡΗ') subtype = 'weights';
    else if(t.sub_category === 'ΚΑΥΣΗ ΛΙΠΟΥΣ ΜΕ ΑΕΡΟΒΙΟ') subtype = 'cardio';
    else subtype = 'combo';
  }
  const mappedDays = days.map(d=>{
    const groups = d.items.filter(it=>it.type==='muscle').map(it=>({
      groupLabel: it.groupLabel, exercise: it.exercise, set: it.set, rep: it.rep, rest: it.rest, failure: it.failure, equipment: it.equipment||[]
    }));
    const cardioSlots = d.items.filter(it=>it.type==='cardio').map(it=>({
      equipment: it.equipment, mode: it.mode, speedLow: it.speedLow, speedHigh: it.speedHigh, incline: it.incline, intensity: it.intensity, minutes: it.minutes
    }));
    return { label: d.label, groups, cardioSlots, topSection:'weights' };
  });
  const record = {
    category, subtype,
    notes: t.notes || '',
    instructions: t.description || '',
    nutrition: t.nutrition ? { kcal:'', text: t.nutrition } : null,
    days: null, cardioSlots: null,
    fromTemplate: true, templateName: t.name || ''
  };
  if(subtype === 'cardio'){
    record.cardioSlots = mappedDays.reduce((acc,d)=>acc.concat(d.cardioSlots),[]);
  } else {
    record.days = mappedDays.filter(d=> d.groups.length>0 || (d.cardioSlots && d.cardioSlots.length>0));
  }
  return record;
}
async function saveTemplateToMyPrograms(templateId){
  const t = state.tplTemplates.find(x=>x.id===templateId);
  if(!t || !auth.customer) return false;
  const record = mapTemplateToCustomRecord(t);
  return await insertProgram(auth.customer.code, record);
}

function bindTplLibEvents(){
  document.querySelectorAll('[data-tpllib-gender]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.tplLibNav = { view:'topcat', gender: el.getAttribute('data-tpllib-gender'), topCategory:null, subCategory:null, programId:null, dayIndex:null, itemIndex:null };
      renderTplLibMain();
    });
  });
  document.querySelectorAll('[data-tpllib-topcat]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const cat = el.getAttribute('data-tpllib-topcat');
      state.tplLibNav.topCategory = cat;
      const hasSub = (TPL_CATEGORIES[cat]||[]).length>0;
      state.tplLibNav.view = hasSub ? 'subcat' : 'programs';
      state.tplLibNav.subCategory = hasSub ? null : null;
      renderTplLibMain();
    });
  });
  document.querySelectorAll('[data-tpllib-subcat]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.tplLibNav.view = 'programs';
      state.tplLibNav.subCategory = el.getAttribute('data-tpllib-subcat');
      renderTplLibMain();
    });
  });
  document.querySelectorAll('[data-tpllib-program]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.tplLibNav.view = 'detail';
      state.tplLibNav.programId = el.getAttribute('data-tpllib-program');
      renderTplLibMain();
    });
  });
  document.querySelectorAll('[data-tpllib-start]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.tplLibNav.view = 'days';
      state.tplLibNav.dayIndex = 0;
      renderTplLibMain();
    });
  });
  document.querySelectorAll('[data-tpllib-day]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.tplLibNav.view = 'items';
      state.tplLibNav.dayIndex = parseInt(el.getAttribute('data-tpllib-day'));
      state.tplLibNav.itemIndex = null;
      renderTplLibMain();
    });
  });
  document.querySelectorAll('[data-tpllib-item]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.tplLibNav.view = 'exercise';
      state.tplLibNav.itemIndex = parseInt(el.getAttribute('data-tpllib-item'));
      renderTplLibMain();
    });
  });
  document.querySelectorAll('[data-tpllib-back]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const target = el.getAttribute('data-tpllib-back');
      state.tplLibNav.view = target;
      if(target==='gender'){ state.tplLibNav = { view:'gender', gender:null, topCategory:null, subCategory:null, programId:null, dayIndex:null, itemIndex:null }; }
      else if(target==='topcat'){ state.tplLibNav.topCategory=null; state.tplLibNav.subCategory=null; state.tplLibNav.programId=null; }
      else if(target==='subcat'){ state.tplLibNav.subCategory=null; state.tplLibNav.programId=null; }
      else if(target==='programs'){ state.tplLibNav.programId=null; }
      else if(target==='detail'){ state.tplLibNav.dayIndex=null; }
      else if(target==='days'){ state.tplLibNav.itemIndex=null; }
      else if(target==='items'){ state.tplLibNav.itemIndex=null; }
      renderTplLibMain();
    });
  });
  document.getElementById('tpllib-start-exercise')?.addEventListener('click', ()=>{
    const t = tplLibCurrentProgram();
    const day = t && (t.data.days||[])[state.tplLibNav.dayIndex];
    const it = day && day.items[state.tplLibNav.itemIndex];
    if(it && it.type==='muscle'){
      state.workoutLogContext = { customerCode: (auth.status==='client' && auth.customer) ? auth.customer.code : null, programName: t ? t.name : '' };
      openWorkoutMode(it, returnFromWorkoutTplLib);
    }
  });
  document.getElementById('tpllib-save-mine')?.addEventListener('click', async ()=>{
    const btn = document.getElementById('tpllib-save-mine');
    const id = btn.getAttribute('data-tpl-id');
    btn.disabled = true; btn.textContent = 'Αποθήκευση...';
    const ok = await saveTemplateToMyPrograms(id);
    btn.disabled = false; btn.innerHTML = ICON.save+'Αποθήκευση στα Προγράμματά μου';
    if(ok){
      toast('Το πρόγραμμα αποθηκεύτηκε στα δικά σου προγράμματα!');
      state.selectedCustomerPrograms = (await loadProgramsFor(auth.customer.code)).sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
    } else {
      toast('Σφάλμα αποθήκευσης. Δοκίμασε ξανά.');
    }
  });
  document.querySelectorAll('[data-tpllib-eqphoto]').forEach(el=>{
    el.addEventListener('click', ()=>{ openLightbox('photo', el.getAttribute('data-tpllib-eqphoto')); });
  });
  document.querySelectorAll('[data-tpllib-eqvideo]').forEach(el=>{
    el.addEventListener('click', ()=>{ openLightbox('video', el.getAttribute('data-tpllib-eqvideo')); });
  });
  document.querySelectorAll('[data-tpllib-eqworkout]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const raw = el.getAttribute('data-tpllib-eqworkout');
      if(!raw) return;
      const t = tplLibCurrentProgram();
      try{
        state.workoutLogContext = { customerCode: (auth.status==='client' && auth.customer) ? auth.customer.code : null, programName: t ? t.name : '' };
        openWorkoutMode(JSON.parse(raw), returnFromWorkoutTplLib);
      }catch(e){}
    });
  });
}

function bindHistoryEvents(){
  const search = document.getElementById('hist-search');
  if(search){

  }
  document.querySelectorAll('[data-client]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const code = el.getAttribute('data-client');

      document.getElementById('hist-detail').innerHTML = `<div class="panel pad" style="color:var(--ink-soft);font-size:13px;">Φόρτωση προγραμμάτων...</div>`;
      state.selectedCustomerPrograms = (await loadProgramsFor(code)).sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));

function bindHistoryDetailEvents(){
  bindWorkoutButtons(()=>render(true));
  document.getElementById('hist-load-log')?.addEventListener('click', async ()=>{
    const btn = document.getElementById('hist-load-log');
    const area = document.getElementById('hist-log-area');

    await loadAndRenderWorkoutLog(state.selectedCustomerCode, 'hist-log-area');
  });
  document.querySelectorAll('[data-hist-edit]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-hist-edit');
      const p = state.selectedCustomerPrograms.find(x=>x.id===id);
      if(p) loadRecordIntoCustomBuilder(p.record, p.id, 'edit');
    });
  });
  document.querySelectorAll('[data-hist-copyedit]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-hist-copyedit');
      const p = state.selectedCustomerPrograms.find(x=>x.id===id);
      if(p) loadRecordIntoCustomBuilder(p.record, p.id, 'copy');
    });
  });
  document.querySelectorAll('[data-tlhead]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-tlhead');
      state.openTlEntries[id] = !state.openTlEntries[id];
      render(true);
    });
  });
  document.querySelectorAll('[data-hist-print]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-hist-print');
      const p = state.selectedCustomerPrograms.find(x=>x.id===id);
      const c = state.customers.find(x=>x.code===state.selectedCustomerCode);
      document.getElementById('print-area').innerHTML = buildPrintHtml(p.record, c);
      window.print();
    });
  });
  document.querySelectorAll('[data-hist-pdf]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-hist-pdf');
      const p = state.selectedCustomerPrograms.find(x=>x.id===id);
      const c = state.customers.find(x=>x.code===state.selectedCustomerCode);
      generatePdfFromRecord(p.record, c);
    });
  });
}

function escHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s){ return escHtml(s); }

   MAIN RENDER
   =================================================================== */
/* ===================================================================
   ΜΗΝΥΜΑΤΑ (μόνο supervisor) — broadcast ανακοίνωση σε όλους τους πελάτες
   =================================================================== */
async function renderAnnouncementsTab(){
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="topbar"><div><h1>Μηνύματα</h1><div class="sub">Στείλε ανακοίνωση που θα βλέπουν όλοι οι πελάτες</div></div></div>
    <div class="panel pad" style="margin-bottom:20px;">
      <div class="section-title"><span class="dot"></span>Νέο μήνυμα</div>
      <textarea id="announce-text" rows="3" style="width:100%;padding:11px 13px;border-radius:8px;border:1.5px solid var(--line);font-size:13.5px;font-family:inherit;resize:vertical;" placeholder="π.χ. Το γυμναστήριο θα είναι κλειστό την Κυριακή..."></textarea>
      <div class="action-bar" style="justify-content:flex-end;">
        <button class="btn btn-primary" id="announce-send">${ICON.save}Αποστολή σε όλους</button>
      </div>
    </div>
    <div class="panel pad" id="announce-list">Φόρτωση...</div>
  `;
  document.getElementById('announce-send').addEventListener('click', async ()=>{
    const ta = document.getElementById('announce-text');
    const msg = ta.value.trim();
    if(!msg){ toast('Γράψε ένα μήνυμα πρώτα.'); return; }
    const btn = document.getElementById('announce-send');
    btn.disabled = true; btn.textContent = 'Αποστολή...';
    const ok = await sendAnnouncement(msg);
    btn.disabled = false; btn.innerHTML = ICON.save+'Αποστολή σε όλους';
    if(ok){ toast('Το μήνυμα στάλθηκε σε όλους τους πελάτες.'); ta.value=''; refreshAnnouncementList(); }
    else toast('Σφάλμα αποστολής.');
  });
  await refreshAnnouncementList();
}
async function refreshAnnouncementList(){
  const el = document.getElementById('announce-list');
  if(!el) return;
  const list = await loadAnnouncements();
  el.innerHTML = `
    <div class="section-title"><span class="dot"></span>Ιστορικό μηνυμάτων</div>
    ${list.length===0 ? `<div class="empty" style="padding:20px 0;"><div class="icon">💬</div><p>Δεν έχεις στείλει ακόμα κανένα μήνυμα.</p></div>` :
      list.map(a=>{
        const d = new Date(a.created_at);
        return `<div class="tl-card" style="margin-bottom:10px;padding:14px 16px;">
          <div style="font-size:11px;color:var(--ink-soft);margin-bottom:6px;">${d.toLocaleDateString('el-GR')} · ${d.toLocaleTimeString('el-GR',{hour:'2-digit',minute:'2-digit'})}</div>
          <div style="font-size:13.5px;line-height:1.5;margin-bottom:8px;">${escHtml(a.message)}</div>
          <button class="btn btn-outline" data-announce-del="${a.id}" style="font-size:11px;padding:6px 10px;">Διαγραφή</button>
        </div>`;
      }).join('')
    }
  `;
  document.querySelectorAll('[data-announce-del]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.getAttribute('data-announce-del');
      btn.disabled = true;
      const ok = await deleteAnnouncement(id);
      if(ok) refreshAnnouncementList(); else { toast('Σφάλμα διαγραφής.'); btn.disabled=false; }
    });
  });
}

function render(skipNav){
  if(!skipNav) renderNav(); else { /* still refresh active states */ 
    document.querySelectorAll('.navitem').forEach(el=>el.classList.toggle('active', el.getAttribute('data-tab')===state.tab));
    document.querySelectorAll('.mobile-tabs button').forEach(el=>el.classList.toggle('active', el.getAttribute('data-tab')===state.tab));
  }
  const main = document.getElementById('main');
  if(state.tab==='builder'){
    main.innerHTML = renderBuilder();
    bindBuilderEvents();
  } else if(state.tab==='announcements'){
    renderAnnouncementsTab();
  } else if(state.tab==='tplbuilder'){
    renderTplBuilderTab();
  } else if(state.tab==='tplpreview'){
    renderTplPreviewTab();
  } else {
    main.innerHTML = renderHistory();
    bindHistoryEvents();
    if(!state.customersLoaded){
      loadCustomers().then(()=>render());
    }
  }
  renderModal();
}

/* ===================================================================
   ROOT DISPATCHER — αποφασίζει τι δείχνει η οθόνη ανάλογα με την
   κατάσταση σύνδεσης (φόρτωση / login / προπονητής / πελάτης)
   =================================================================== */
function renderRoot(){
  const authRoot = document.getElementById('auth-root');
  const appRoot = document.getElementById('app');
  const mobileTopbar = document.getElementById('mobile-topbar');

  if(auth.status === 'trainer'){
    authRoot.classList.add('hidden');
    appRoot.classList.remove('hidden');
    mobileTopbar.classList.remove('hidden');
    render();
  } else if(auth.status === 'client'){
    authRoot.classList.add('hidden');
    appRoot.classList.remove('hidden');
    mobileTopbar.classList.remove('hidden');
    renderAppClient();
  } else {
    appRoot.classList.add('hidden');
    mobileTopbar.classList.add('hidden');
    authRoot.classList.remove('hidden');
    renderAuthScreens();
  }
}

document.getElementById('mobile-logout')?.addEventListener('click', doLogout);

renderRoot();
resolveAuthState();

(function initScrollTopBtn(){
  const btn = document.getElementById('scroll-top-btn');
  if(!btn) return;
  window.addEventListener('scroll', ()=>{
    btn.style.display = window.scrollY > 400 ? 'flex' : 'none';
  }, { passive:true });
  btn.addEventListener('click', ()=>{
    window.scrollTo({ top:0, behavior:'smooth' });
  });
})();

</script>
